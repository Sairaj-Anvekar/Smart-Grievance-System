# ============================================================
# Smart Grievance System — Docker Compose (Local Development)
# Usage: docker compose up -d
# ============================================================

services:
  # ---------- Backend API ----------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sgs-backend
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app/app  # Hot reload
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ---------- Celery Worker ----------
  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sgs-celery-worker
    volumes:
      - ../backend/app:/app/app
    env_file:
      - ../.env
    depends_on:
      - backend
    restart: unless-stopped
    command: celery -A app.tasks worker --loglevel=info

  # ---------- Celery Beat (Scheduler) ----------
  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sgs-celery-beat
    volumes:
      - ../backend/app:/app/app
    env_file:
      - ../.env
    depends_on:
      - backend
    restart: unless-stopped
    command: celery -A app.tasks beat --loglevel=info

  # ---------- PostgreSQL + PostGIS ----------
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sgs-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grievance_db}
      POSTGRES_USER: ${POSTGRES_USER:-grievance_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grievance_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: sgs-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------- MinIO (S3-compatible storage) ----------
  minio:
    image: minio/minio:latest
    container_name: sgs-minio
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
